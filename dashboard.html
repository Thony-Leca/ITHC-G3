<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Completo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 1rem;
            min-height: 100vh;
        }
        #dashboard {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            padding: 1rem;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .chart-container {
            height: 100%;
            background-color: #fafafa;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }
        .chart-container h2 {
            margin: 0;
            font-size: 18px;
        }
        .chart-container p {
            margin: 5px 0 15px 0;
            font-size: 14px;
            color: #666;
        }
        canvas {
            width: 100% !important;
            max-height: 300px;
        }
    </style>
</head>
<body>
    <div id="dashboard" class="container-fluid">
        <h1 class="h3 text-center mb-4">Dashboard de turismo</h1>
        <div class="row g-3">
        <div class="col-12 col-md-6">
            <div class="chart-container">
            <h2>Gráfico de Barras</h2>
            <p>Distribución de visitas por Ciudad</p>
            <canvas id="bar-chart"></canvas>
            </div>
        </div>
        <div class="col-12 col-md-6">
            <div class="chart-container">
            <h2>Gráfico de Líneas</h2>
            <p>Ventas mensuales</p>
            <canvas id="line-chart"></canvas>
            </div>
        </div>
        <div class="col-12 col-md-6">
            <div class="chart-container">
            <h2>Gráfico de Pastel</h2>
            <p>Visitas por Ciudad</p>
            <canvas id="pie-chart"></canvas>
            </div>
        </div>
        <div class="col-12 col-md-6">
            <div class="chart-container">
            <h2>Gráfico de Radar</h2>
            <p>Comparación de actividades</p>
            <canvas id="radar-chart"></canvas>
            </div>
        </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Gráfico de Barras
            var ctxBar = document.getElementById('bar-chart').getContext('2d');
            new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: ['Machu Picchu', 'Lineas de Nazca', 'Caral'],
                    datasets: [{
                        label: '# of Votes',
                        data: [12, 19, 3, 5, 2, 3],
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.2)',
                            'rgba(54, 162, 235, 0.2)',
                            'rgba(255, 206, 86, 0.2)'
                            
                        ],
                        borderColor: [
                            'rgba(255, 99, 132, 1)',
                            'rgba(54, 162, 235, 1)',
                            'rgba(255, 206, 86, 1)'
                            
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            // Gráfico de Líneas
            var ctxLine = document.getElementById('line-chart').getContext('2d');
            new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: ['January', 'February', 'March', 'April', 'May', 'June', 'July'],
                    datasets: [{
                        label: 'Sales',
                        data: [65, 59, 80, 81, 56, 55, 40],
                        fill: false,
                        borderColor: 'rgb(75, 192, 192)',
                        tension: 0.1
                    }]
                }
            });

            // Gráfico de Pastel
            var ctxPie = document.getElementById('pie-chart').getContext('2d');
            new Chart(ctxPie, {
                type: 'pie',
                data: {
                    labels: ['Machu Picchu', 'Lineas de Nazca', 'Caral'],
                    datasets: [{
                        label: 'Votes',
                        data: [300, 50, 100],
                        backgroundColor: [
                            'rgb(255, 99, 132)',
                            'rgb(54, 162, 235)',
                            'rgb(255, 205, 86)'
                        ],
                        hoverOffset: 4
                    }]
                }
            });

            // Gráfico de Radar
            var ctxRadar = document.getElementById('radar-chart').getContext('2d');
            new Chart(ctxRadar, {
                type: 'radar',
                data: {
                    labels: ['Eating', 'Drinking', 'Sleeping', 'Designing', 'Coding', 'Cycling', 'Running'],
                    datasets: [{
                        label: 'My First Dataset',
                        data: [65, 59, 90, 81, 56, 55, 40],
                        fill: true,
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderColor: 'rgb(255, 99, 132)',
                        pointBackgroundColor: 'rgb(255, 99, 132)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgb(255, 99, 132)'
                    }, {
                        label: 'My Second Dataset',
                        data: [28, 48, 40, 19, 96, 27, 100],
                        fill: true,
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        borderColor: 'rgb(54, 162, 235)',
                        pointBackgroundColor: 'rgb(54, 162, 235)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgb(54, 162, 235)'
                    }]
                },
                options: {
                    elements: {
                        line: {
                            borderWidth: 3
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
