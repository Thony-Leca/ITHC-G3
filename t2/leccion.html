<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lección interactiva | LingoFlow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f8faff;
        color: #233144;
        font-family: system-ui, sans-serif;
      }
      .navbar,
      .card {
        border: 1px solid #cbd5e1;
      }
      .leccion {
        max-width: 760px;
        margin: auto;
      }
      .opcion {
        min-height: 58px;
        text-align: left;
        border: 2px solid #cbd5e1;
      }
      .opcion.seleccionada {
        border-color: #2563eb;
        background: #eff4ff;
        color: #123b9d;
      }
      .progreso {
        height: 12px;
      }
      .access {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 10;
      }
      .high-contrast {
        background: #000 !important;
        color: #fff !important;
      }
      .high-contrast .card,
      .high-contrast nav,
      .high-contrast .offcanvas,
      .high-contrast .modal-content {
        background: #111 !important;
        color: #fff !important;
        border-color: #ff0 !important;
      }
    </style>
  </head>
  <body>
    <nav class="navbar bg-white">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="dashboard.html"
          ><i class="bi bi-book-half me-2"></i>LingoFlow</a
        ><a href="perfil.html" class="nav-link">Mi perfil</a>
      </div>
    </nav>
    <main class="container py-4 py-lg-5">
      <div class="leccion">
        <div class="d-flex justify-content-between mb-3">
          <button class="btn btn-outline-secondary" id="salir">
            <i class="bi bi-arrow-left me-1"></i>Salir</button
          ><span class="badge text-bg-danger fs-6"
            ><i class="bi bi-heart-fill me-1"></i><span id="vidas"></span
          ></span>
        </div>
        <div class="d-flex justify-content-between small mb-2">
          <span id="numero"></span><span id="porcentaje"></span>
        </div>
        <div class="progress progreso mb-4">
          <div id="barra" class="progress-bar"></div>
        </div>
        <section class="card p-4 p-md-5">
          <span class="small text-uppercase fw-bold text-secondary"
            >Saludos y presentaciones · A1</span
          >
          <h1 id="pregunta" class="h3 fw-bold mt-2 mb-4"></h1>
          <div id="audio"></div>
          <div id="opciones"></div>
          <div id="feedback" class="mt-3" aria-live="polite"></div>
          <div class="d-grid mt-3">
            <button class="btn btn-primary btn-lg" id="comprobar" disabled>
              Comprobar respuesta
            </button>
          </div>
        </section>
      </div>
    </main>
    <div class="modal fade" id="resumen" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5">¡Lección completada!</h2>
          </div>
          <div class="modal-body" id="detalleResumen"></div>
          <div class="modal-footer">
            <a class="btn btn-primary" href="dashboard.html"
              >Volver al progreso</a
            >
          </div>
        </div>
      </div>
    </div>
    <button
      class="btn btn-primary rounded-circle access"
      data-bs-toggle="offcanvas"
      data-bs-target="#accesibilidad"
      aria-label="Abrir accesibilidad"
    >
      <i class="bi bi-universal-access fs-4"></i>
    </button>
    <div class="offcanvas offcanvas-end" id="accesibilidad">
      <div class="offcanvas-header">
        <h2 class="h5">Accesibilidad</h2>
        <button class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body">
        <button id="contraste" class="btn btn-outline-primary w-100 mb-2">
          Alto contraste
        </button>
        <div class="btn-group w-100">
          <button id="menos" class="btn btn-outline-secondary">A−</button
          ><button id="mas" class="btn btn-outline-secondary">A+</button>
        </div>
        <button id="foco" class="btn btn-outline-secondary w-100 mt-2">
          Foco de teclado</button
        ><button id="leer" class="btn btn-outline-secondary w-100 mt-2">
          Leer pantalla
        </button>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
fetch('data.json').then(respuesta=>respuesta.json()).then(datos=>{

      // Preguntas y datos locales de las tres cuentas demo
      const llave = "lingo-usuarios";
      let usuarios = JSON.parse(localStorage.getItem(llave) || "null") ||datos.usuarios;localStorage.setItem(llave,JSON.stringify(usuarios));
      const id = localStorage.getItem("lingo-usuario-activo") || "carlos";
      let usuario = usuarios.find((u) => u.id === id) || usuarios[0],
        actual = 0,
        elegida = "",
        aciertos = 0,
        errores = 0,
        segundos = 0;
      const inicio = Date.now(),
        guardar = () => localStorage.setItem(llave, JSON.stringify(usuarios));
      const preguntas = [
        {
          texto: "Escucha y elige la traducción correcta.",
          tipo: "audio",
          frase: "Good morning",
          traduccion: "Buenos días",
          opciones: ["Buenas noches", "Buenos días", "Hasta luego"],
          pista: "Usamos esta frase para saludar por la mañana.",
        },
        {
          texto: "¿Cómo dices “Me llamo Ana” en inglés?",
          traduccion: "Me llamo Ana",
          correcta: "My name is Ana",
          opciones: ["I am fine, Ana", "My name is Ana", "See you, Ana"],
          pista: "La estructura empieza con “My name is…”.",
        },
        {
          texto: "Ordena las palabras para formar “¿Cómo estás?”",
          tipo: "orden",
          palabras: ["are", "How", "you"],
          respuesta: "How are you",
          traduccion: "¿Cómo estás?",
          pista: "Empieza con la palabra interrogativa “How”.",
        },
        {
          texto: "Completa: “I ___ a student.”",
          traduccion: "Soy estudiante",
          correcta: "am",
          opciones: ["am", "is", "are"],
          pista: "Con “I” usamos el verbo “to be” como “am”.",
        },
        {
          texto: "Ordena las palabras para decir “Muchas gracias”.",
          tipo: "orden",
          palabras: ["you", "Thank", "very", "much"],
          respuesta: "Thank you very much",
          traduccion: "Muchas gracias",
          pista: "La expresión comienza con “Thank you”.",
        },
      ];
      function mostrarPregunta() {
        elegida = "";
        const q = preguntas[actual],
          porcentaje = Math.round((actual / preguntas.length) * 100);
        document.querySelector("#vidas").textContent = usuario.vidas + " / 5";
        document.querySelector("#numero").textContent =
          "Pregunta " + (actual + 1) + " de " + preguntas.length;
        document.querySelector("#porcentaje").textContent =
          porcentaje + "% completado";
        document.querySelector("#barra").style.width = porcentaje + "%";
        document.querySelector("#pregunta").textContent = q.texto;
        document.querySelector("#feedback").innerHTML = "";
        document.querySelector("#comprobar").disabled = true;
        document.querySelector("#comprobar").textContent =
          "Comprobar respuesta";
        document.querySelector("#audio").innerHTML =
          q.tipo === "audio"
            ? '<div class="d-flex align-items-center gap-3 p-3 rounded bg-light mb-4"><button class="btn btn-primary btn-lg rounded-circle" id="reproducir" aria-label="Reproducir pronunciación"><i class="bi bi-volume-up-fill"></i></button><div><strong>' +
              q.frase +
              '</strong><div class="small text-secondary" id="estadoAudio">Pronunciación en inglés · ' +
              q.frase +
              '</div><span class="visually-hidden">Transcripción: ' +
              q.frase +
              "</span></div></div>"
            : "";
        if (q.tipo === "orden") {
          document.querySelector("#opciones").innerHTML = q.palabras
            .map(
              (w) =>
                '<button class="btn btn-outline-primary me-2 mb-2" data-palabra="' +
                w +
                '">' +
                w +
                "</button>",
            )
            .join("");
        } else {
          document.querySelector("#opciones").innerHTML = q.opciones
            .map(
              (w, i) =>
                '<button class="btn opcion w-100 mb-2" data-opcion="' +
                i +
                '">' +
                w +
                "</button>",
            )
            .join("");
        }
        document.querySelectorAll("[data-opcion]").forEach(
          (b) =>
            (b.onclick = () => {
              document
                .querySelectorAll("[data-opcion]")
                .forEach((x) => x.classList.remove("seleccionada"));
              b.classList.add("seleccionada");
              elegida = q.opciones[Number(b.dataset.opcion)];
              document.querySelector("#comprobar").disabled = false;
            }),
        );
        document.querySelectorAll("[data-palabra]").forEach(
          (b) =>
            (b.onclick = () => {
              b.classList.toggle("active");
              elegida = [...document.querySelectorAll("[data-palabra].active")]
                .map((x) => x.dataset.palabra)
                .join(" ");
              document.querySelector("#comprobar").disabled = !elegida;
            }),
        );
        if (q.tipo === "audio")
          document.querySelector("#reproducir").onclick = () =>
            hablar(q.frase, "en-US", document.querySelector("#estadoAudio"));
        document.querySelector("#comprobar").onclick = validar;
      }
      function validar() {
        const q = preguntas[actual],
          respuesta =
            q.tipo === "orden" ? q.respuesta : q.correcta || q.traduccion,
          correcto = elegida.toLowerCase() === respuesta.toLowerCase();
        if (correcto) {
          aciertos++;
          document.querySelector("#feedback").innerHTML =
            '<div class="alert alert-success"><strong><i class="bi bi-check-circle-fill me-1"></i>¡Correcto!</strong> ' +
            q.traduccion +
            "</div>";
        } else {
          errores++;
          usuario.vidas = Math.max(0, usuario.vidas - 1);
          document.querySelector("#vidas").textContent = usuario.vidas + " / 5";
          guardar();
          document.querySelector("#feedback").innerHTML =
            '<div class="alert alert-danger"><strong><i class="bi bi-lightbulb me-1"></i>Pista:</strong> ' +
            q.pista +
            "</div>";
        }
        const boton = document.querySelector("#comprobar");
        boton.textContent =
          actual === preguntas.length - 1 ? "Ver resumen" : "Siguiente";
        boton.onclick = () => {
          actual++;
          if (actual < preguntas.length) mostrarPregunta();
          else finalizar();
        };
      }
      function finalizar() {
        const tiempo = Math.floor((Date.now() - inicio) / 1000);
        usuario.xp += aciertos * 10;
        usuario.avance = Math.min(100, usuario.avance + 10);
        usuario.minutos[(new Date().getDay() + 6) % 7] = Math.max(
          usuario.minutos[(new Date().getDay() + 6) % 7],
          Math.max(1, Math.round(tiempo / 60)),
        );
        guardar();
        document.querySelector("#detalleResumen").innerHTML =
          '<div class="text-center mb-3"><div class="display-5 fw-bold text-primary">' +
          Math.round((aciertos / preguntas.length) * 100) +
          '%</div>Precisión de esta ronda</div><div class="row text-center"><div class="col">' +
          Math.floor(tiempo / 60) +
          ":" +
          String(tiempo % 60).padStart(2, "0") +
          '<div class="small text-secondary">Tiempo</div></div><div class="col">+' +
          aciertos * 10 +
          ' XP<div class="small text-secondary">Puntos</div></div><div class="col">' +
          errores +
          '<div class="small text-secondary">A reforzar</div></div></div><p class="mt-3">' +
          (errores
            ? "Vuelve a practicar las pistas cuando quieras."
            : "¡Excelente! Ya dominas las expresiones de esta ronda.") +
          "</p>";
        bootstrap.Modal.getOrCreateInstance(
          document.querySelector("#resumen"),
          { backdrop: "static" },
        ).show();
      }
      function hablar(texto, idioma, estado) {
        speechSynthesis.cancel();
        const voz = new SpeechSynthesisUtterance(texto);
        voz.lang = idioma;
        voz.onstart = () => (estado.textContent = "Reproduciendo…");
        voz.onend = () =>
          (estado.textContent = "Pronunciación en inglés · " + texto);
        speechSynthesis.speak(voz);
      }
      document.querySelector("#salir").onclick = () => {
        if (confirm("¿Salir de esta lección?"))
          location.href = "dashboard.html";
      };
      mostrarPregunta();
      const pref = JSON.parse(
        localStorage.getItem("lingo-accesibilidad") || "{}",
      );
      if (pref.contraste) document.body.classList.add("high-contrast");
      document.querySelector("#contraste").onclick = () => {
        document.body.classList.toggle("high-contrast");
        pref.contraste = document.body.classList.contains("high-contrast");
        localStorage.setItem("lingo-accesibilidad", JSON.stringify(pref));
      };
      document.querySelector("#mas").onclick = () => tamano(15);
      document.querySelector("#menos").onclick = () => tamano(-15);
      function tamano(n) {
        pref.fuente = Math.max(100, Math.min(130, (pref.fuente || 100) + n));
        document.documentElement.style.fontSize = pref.fuente + "%";
        localStorage.setItem("lingo-accesibilidad", JSON.stringify(pref));
      }
      document.querySelector("#foco").onclick = () =>
        document.body.classList.toggle("keyboard-focus");
      document.querySelector("#leer").onclick = () => {
        const voz = new SpeechSynthesisUtterance(
          document.querySelector("main").innerText,
        );
        voz.lang = "es-ES";
        speechSynthesis.speak(voz);
      };
    
}).catch(error=>{console.error(error);alert('No se pudo cargar data.json. Usa Live Server.')});
</script>
    <style>
      .keyboard-focus :focus-visible {
        outline: 3px solid #f97316 !important;
        outline-offset: 3px;
      }
    </style>
  </body>
</html>
