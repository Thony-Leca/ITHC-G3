<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso | LingoFlow</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><style>body{background:#f0f5ff;color:#233144;font-family:system-ui,sans-serif}.navbar,.card{border:1px solid #cbd5e1}.auth{min-height:90vh;display:grid;place-items:center;padding:2rem 1rem}.auth-card{width:min(100%,560px)}.access{position:fixed;right:20px;bottom:20px}.high-contrast{background:#000!important;color:#fff!important}.high-contrast .card,.high-contrast nav,.high-contrast .offcanvas,.high-contrast .modal-content{background:#111!important;color:#fff!important;border-color:#ff0!important}</style></head>
<body><nav class="navbar navbar-expand bg-white"><div class="container"><a class="navbar-brand fw-bold text-primary" href="index.html"><i class="bi bi-book-half me-2"></i>LingoFlow</a><a href="index.html" class="nav-link">Volver al inicio</a></div></nav>
<main class="auth"><section class="card auth-card p-4 p-md-5"><div class="text-center mb-4"><i class="bi bi-book-half fs-1 text-primary"></i><h1 class="h3 fw-bold mt-2">Tu próxima práctica empieza aquí</h1><p class="text-secondary">Ingresa o crea una cuenta para guardar tu progreso.</p></div><ul class="nav nav-pills nav-fill mb-4"><li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#entrar">Iniciar sesión</button></li><li class="nav-item"><button id="pestanaRegistro" class="nav-link" data-bs-toggle="pill" data-bs-target="#registro">Crear cuenta</button></li></ul><div class="tab-content"><section id="entrar" class="tab-pane fade show active"><div id="avisoLogin" aria-live="polite"></div><form id="formLogin"><div class="mb-3"><label class="form-label" for="correo">Correo electrónico</label><input class="form-control form-control-lg" type="email" id="correo" autocomplete="email" required></div><div class="mb-3"><label class="form-label" for="clave">Contraseña</label><div class="input-group input-group-lg"><input class="form-control" type="password" id="clave" required><button class="btn btn-outline-secondary" type="button" id="verClave" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button></div></div><div class="text-end mb-3"><button type="button" class="btn btn-link btn-sm" data-bs-toggle="modal" data-bs-target="#recuperar">¿Olvidaste tu contraseña?</button></div><button class="btn btn-primary btn-lg w-100">Iniciar sesión</button></form><hr><h2 class="h6 text-center">Acceso rápido para pruebas</h2><div id="cuentasDemo" class="d-grid gap-2"></div><p class="small text-center text-secondary mt-2">Clave de las cuentas demo: <code>demo123</code></p></section>
<section id="registro" class="tab-pane fade"><div id="avisoRegistro" aria-live="polite"></div><form id="formRegistro"><div class="mb-3"><label class="form-label" for="nombre">Nombre completo</label><input class="form-control form-control-lg" id="nombre" required></div><div class="mb-3"><label class="form-label" for="nuevoCorreo">Correo electrónico</label><input class="form-control form-control-lg" type="email" id="nuevoCorreo" required></div><div class="mb-3"><label class="form-label" for="nuevaClave">Contraseña</label><input class="form-control form-control-lg" type="password" id="nuevaClave" minlength="6" required><div class="form-text">Usa al menos 6 caracteres.</div></div><button class="btn btn-primary btn-lg w-100">Crear mi cuenta</button></form></section></div></section></main>
<div class="modal fade" id="recuperar" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title h5">Recuperar contraseña</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body"><label for="correoRecuperacion" class="form-label">Correo electrónico</label><input type="email" class="form-control" id="correoRecuperacion"></div><div class="modal-footer"><button class="btn btn-primary" id="enviarRecuperacion">Enviar enlace de recuperación</button></div></div></div></div>
<button class="btn btn-primary rounded-circle access" data-bs-toggle="offcanvas" data-bs-target="#accesibilidad" aria-label="Abrir accesibilidad"><i class="bi bi-universal-access fs-4"></i></button><div class="offcanvas offcanvas-end" id="accesibilidad"><div class="offcanvas-header"><h2 class="h5">Accesibilidad</h2><button class="btn-close" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body"><button class="btn btn-outline-primary w-100 mb-2" id="contraste">Alto contraste</button><div class="btn-group w-100"><button class="btn btn-outline-secondary" id="menos">A−</button><button class="btn btn-outline-secondary" id="mas">A+</button></div><button class="btn btn-outline-secondary w-100 mt-2" id="leer">Leer pantalla</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>
// Datos locales independientes para las cuentas de demostración
const cuentasClave='lingo-usuarios';let cuentas=JSON.parse(localStorage.getItem(cuentasClave)||'null')||[{id:'carlos',nombre:'Carlos Mendoza',correo:'carlos@lingoflow.test',clave:'demo123',carrera:'Estudiante de Ingeniería',xp:450,racha:7,vidas:5,avance:60,minutos:[8,12,10,7,14,5,0],habilidades:[85,75,65,90],palabras:[['hello','hola',true],['good morning','buenos días',true],['student','estudiante',true],['to practice','practicar',false]]},{id:'lucia',nombre:'Lucía Torres',correo:'lucia@lingoflow.test',clave:'demo123',carrera:'Estudiante de Administración',xp:280,racha:3,vidas:4,avance:35,minutos:[10,6,8,12,0,4,0],habilidades:[65,55,72,60],palabras:[['please','por favor',true],['thank you','gracias',true],['to order','pedir',false]]},{id:'mateo',nombre:'Mateo Rojas',correo:'mateo@lingoflow.test',clave:'demo123',carrera:'Estudiante de Diseño',xp:720,racha:12,vidas:5,avance:82,minutos:[15,10,13,11,9,16,8],habilidades:[92,84,78,88],palabras:[['welcome','bienvenido',true],['to understand','entender',true],['sentence','oración',true],['careful','cuidadoso',false]]}];localStorage.setItem(cuentasClave,JSON.stringify(cuentas));
const aviso=(id,texto)=>document.querySelector(id).innerHTML='<div class="alert alert-danger" role="alert">'+texto+'</div>', guardar=()=>localStorage.setItem(cuentasClave,JSON.stringify(cuentas)), entrar=cuenta=>{localStorage.setItem('lingo-usuario-activo',cuenta.id);location.href='dashboard.html'};
document.querySelector('#cuentasDemo').innerHTML=cuentas.slice(0,3).map(u=>'<button class="btn btn-outline-secondary text-start" data-demo="'+u.id+'"><i class="bi bi-person-circle me-2"></i>'+u.nombre.split(' ')[0]+' · '+u.xp+' XP</button>').join('');document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>entrar(cuentas.find(u=>u.id===b.dataset.demo)));
document.querySelector('#verClave').onclick=()=>{const campo=document.querySelector('#clave');campo.type=campo.type==='password'?'text':'password'};document.querySelector('#formLogin').onsubmit=e=>{e.preventDefault();const u=cuentas.find(x=>x.correo.toLowerCase()===document.querySelector('#correo').value.trim().toLowerCase()&&x.clave===document.querySelector('#clave').value);if(u)entrar(u);else aviso('#avisoLogin','No encontramos una cuenta con esos datos. Revisa el correo y la contraseña.')};document.querySelector('#formRegistro').onsubmit=e=>{e.preventDefault();const nombre=document.querySelector('#nombre').value.trim(),correo=document.querySelector('#nuevoCorreo').value.trim().toLowerCase(),clave=document.querySelector('#nuevaClave').value;if(!nombre||!correo.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)||clave.length<6)return aviso('#avisoRegistro','Completa los campos con un correo válido y una contraseña de 6 caracteres como mínimo.');if(cuentas.some(u=>u.correo.toLowerCase()===correo))return aviso('#avisoRegistro','Ese correo ya tiene una cuenta. Inicia sesión o utiliza otro correo.');const u={id:'usuario-'+Date.now(),nombre,correo,clave,carrera:'Estudiante',xp:0,racha:0,vidas:5,avance:0,minutos:[0,0,0,0,0,0,0],habilidades:[0,0,0,0],palabras:[]};cuentas.push(u);guardar();entrar(u)};if(location.hash==='#registro')new bootstrap.Tab('#pestanaRegistro').show();document.querySelector('#enviarRecuperacion').onclick=()=>{document.querySelector('#recuperar .modal-body').innerHTML='<div class="alert alert-success">Si existe una cuenta con ese correo, recibirá instrucciones para recuperar su acceso.</div>';document.querySelector('#enviarRecuperacion').remove()};
const pref=JSON.parse(localStorage.getItem('lingo-accesibilidad')||'{}');if(pref.contraste)document.body.classList.add('high-contrast');document.querySelector('#contraste').onclick=()=>{document.body.classList.toggle('high-contrast');pref.contraste=document.body.classList.contains('high-contrast');localStorage.setItem('lingo-accesibilidad',JSON.stringify(pref))};document.querySelector('#mas').onclick=()=>tamano(15);document.querySelector('#menos').onclick=()=>tamano(-15);function tamano(delta){pref.fuente=Math.max(100,Math.min(130,(pref.fuente||100)+delta));document.documentElement.style.fontSize=pref.fuente+'%';localStorage.setItem('lingo-accesibilidad',JSON.stringify(pref))}document.querySelector('#leer').onclick=()=>{const voz=new SpeechSynthesisUtterance(document.querySelector('main').innerText);voz.lang='es-ES';speechSynthesis.speak(voz)};
</script></body></html>
